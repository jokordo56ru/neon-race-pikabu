<body>
<canvas id="game" aria-label="Игровое поле Неон-рейс"></canvas>
<div id="ui">
  <div id="gameHud" class="gameHud hidden">
    <div class="hudGroup">
      <div class="pill"><span id="hudScoreLabel">СЧЁТ</span> <span id="hudScore">0</span></div>
      <div class="pill">♥ <span id="hudLives">3</span></div>
      <div class="pill">LV <span id="hudRunLevel">1</span> · <span id="hudRunXP">0/6</span></div>
    </div>
    <div class="hudGroup">
      <div class="pill">✦ <span id="hudCrystals">0</span></div>
      <button class="iconbtn" id="soundBtn" aria-label="Звук" title="Звук">♫</button>
      <button class="iconbtn" id="pauseBtn" aria-label="Пауза">Ⅱ</button>
    </div>
  </div>
  <div id="runStatus" class="hidden"><span id="eventBadge" class="statusChip event hidden"></span><span id="powerBadge" class="statusChip power hidden"></span></div>
  <div id="levelUpOverlay" class="levelUpOverlay hidden" role="dialog" aria-modal="true" aria-labelledby="levelUpHeadline">
    <section class="levelUpPanel">
      <div class="levelUpKicker">✦ ПОВЫШЕНИЕ УРОВНЯ · <span id="runLevelTitle">2</span></div>
      <h2 id="levelUpHeadline">ВЫБЕРИ ОДНО УСИЛЕНИЕ</h2>
      <p>Выбери улучшение для этого полёта. Сочетай оружие, защиту и сбор ресурсов.</p>
      <div id="runLevelChoices" class="runLevelChoices"></div>
    </section>
  </div>
  <div id="touch" class="hidden" aria-label="Экранное управление">
    <button class="touchbtn" id="leftBtn" aria-label="Влево">←</button>
    <button class="touchbtn" id="upBtn" aria-label="Вверх">↑</button>
    <button class="touchbtn" id="downBtn" aria-label="Вниз">↓</button>
    <button class="touchbtn" id="rightBtn" aria-label="Вправо">→</button>
  </div>
  <div id="menuOverlay" class="overlay">
    <div class="panel">
      <div class="header">
        <div class="brand"><div class="brandMark">✦</div><div><h1 id="brandTitle">НЕОН-РЕЙС</h1><small id="brandSubtitle">КОСМИЧЕСКАЯ АРКАДА</small></div></div>
        <div class="wallet"><select id="languageSelect" class="languageSelect" aria-label="Язык игры" title="Язык игры"><option value="ru">Русский</option><option value="en">English</option></select><div class="walletItem">✦ <b id="walletCrystals">0</b></div><div class="walletItem"><span id="walletLevelLabel">УРОВЕНЬ</span> <b id="walletLevel">1</b></div></div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="home" id="tabHome">ПОЛЁТ</button>
        <button class="tab" data-tab="garage" id="tabGarage">АНГАР</button>
        <button class="tab" data-tab="upgrades" id="tabUpgrades">УЛУЧШЕНИЯ</button>
        <button class="tab" data-tab="pilot" id="tabPilot">ПИЛОТ</button>
      </nav>
      <main id="screenContent" class="content"></main>
      <div class="menuFooter"><span id="saveStatus" class="saveStatus">Прогресс сохраняется автоматически</span><span class="smallText" id="footerControls">← → ↑ ↓ / WASD · На телефоне — джойстик или перетаскивание</span><button class="iconbtn" id="menuSoundBtn" aria-label="Включить или выключить звук" title="Звук">♫</button></div>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d');
const LANGUAGE_KEY = 'neonRaceLanguage';

  try{const saved=localStorage.getItem(LANGUAGE_KEY);if(saved==='ru'||saved==='en')return saved}catch(e){}
  return 'ru'; // Pikabu requires Russian as the first-launch language.
}
let currentLanguage=detectLanguage();
const TRANSLATIONS={
  'Игровое поле Неон-рейс':'Neon Race game field','Звук':'Sound','Пауза':'Pause','Экранное управление':'Touch controls','Влево':'Left','Вверх':'Up','Вниз':'Down','Вправо':'Right','Включить или выключить звук':'Toggle sound','НЕОН-РЕЙС':'NEON RACE','КОСМИЧЕСКАЯ АРКАДА':'SPACE ARCADE','СЧЁТ':'SCORE','УРОВЕНЬ':'LEVEL','ПОЛЁТ':'FLIGHT','АНГАР':'HANGAR','УЛУЧШЕНИЯ':'UPGRADES','ПИЛОТ':'PILOT','ТОП':'LEADERBOARDS','Прогресс сохраняется автоматически':'Progress is saved automatically','← → ↑ ↓ / WASD · На телефоне — джойстик или перетаскивание':'← → ↑ ↓ / WASD · On mobile, use the on-screen controls or drag',
  'Стриж':'Swift','Сбалансированный корабль для первых полётов.':'A balanced ship for your first flights.','Без особых бонусов':'No special perks','Фантом':'Phantom','Лёгкий корпус и отзывчивые двигатели.':'A light hull and responsive engines.','+12% к скорости управления':'+12% movement speed','Страж':'Guardian','Усиленная конструкция выдерживает больше ударов.':'Reinforced construction withstands more hits.','+1 дополнительная жизнь':'+1 extra life','Магнит':'Magnet','Энергетический контур притягивает звёзды.':'An energy field attracts stars.','+20 к радиусу сбора':'+20 collection radius','Призрак':'Wraith','Фазовый двигатель один раз спасает от столкновения.':'A phase engine saves you from one collision.','Игнорирует первое столкновение':'Survives the first collision',

const translationPairs=Object.entries(TRANSLATIONS).sort((a,b)=>b[0].length-a[0].length);
function translateText(value){
  let text=String(value??'');
  if(currentLanguage!=='en')return text;
  for(const [ru,en] of translationPairs)text=text.split(ru).join(en);
  return text;
}
function translateMarkup(markup){return translateText(markup)}

function scheduleCloudSave(){
  if(pkbSdk?.storage){
    cloudQueued=true;
    if(pkbSaveTimer)clearTimeout(pkbSaveTimer);
    pkbSaveTimer=setTimeout(()=>{
      pkbSaveTimer=null;
      try{
        pkbSdk.storage.set('neonRaceProfile',JSON.parse(JSON.stringify(profile)));
        lastCloudSyncAt=Date.now();
        cloudQueued=false;pkbStorageError=null;
        setSaveStatus('Изменения записаны в хранилище Пикабу; облачная синхронизация выполняется автоматически');
      }catch(e){console.warn('Pikabu storage.set failed',e);setSaveStatus('Облако Пикабу временно недоступно; локальный прогресс сохранён')}
    },500);
    return;
  }
  if(!yPlayer||typeof yPlayer.setData!=='function')return;
  lastCloudSyncAt=Date.now();cloudQueued=true;
  if(cloudBusy)return;
  cloudBusy=true;
  setTimeout(async()=>{
    try{
      while(cloudQueued){
        cloudQueued=false;
        const snapshot=JSON.parse(JSON.stringify(profile));
        await yPlayer.setData({neonRaceProfile:snapshot},true);
        setSaveStatus('Облачное и локальное сохранение включены');
        await syncPlatformStats(false);
      }
    }catch(e){console.warn('Yandex cloud save failed',e);setSaveStatus('Локальный прогресс сохранён; облако временно недоступно')}
    finally{cloudBusy=false;if(cloudQueued)scheduleCloudSave()}
  },300);
}
async function syncPikabuCloud(force=true){
  if(!pkbSdk?.storage){setSaveStatus('Облачные сохранения Пикабу доступны после подключения SDK Пикабу.');return false}
  try{
    if(pkbSaveTimer){clearTimeout(pkbSaveTimer);pkbSaveTimer=null}
    pkbSdk.storage.set('neonRaceProfile',JSON.parse(JSON.stringify(profile)));
    cloudQueued=false;
    if(!force){setSaveStatus('Прогресс отправлен в облачное хранилище Пикабу');return true}
    // SDK autosaves set() changes; explicit flush is throttled to stay under platform limits.
    const wait=30000-(Date.now()-pkbLastFlushAt);
    if(pkbLastFlushAt&&wait>0){setSaveStatus('Изменения сохранены; облачная синхронизация выполняется автоматически');return true}
    if(pkbFlushBusy)return true;
    pkbFlushBusy=true;
    const result=await pkbSdk.storage.flush();
    pkbLastFlushAt=Date.now();
    if(result?.success){pkbStorageError=null;setSaveStatus('Облачное сохранение Пикабу синхронизировано');return true}
    pkbStorageError=result?.reason||'UNKNOWN';
    setSaveStatus(pkbStorageError==='REVISION_CONFLICT'?'Сохранение изменено на другом устройстве. Перезагрузи игру, чтобы загрузить актуальный прогресс.':'Не удалось сохранить в облако Пикабу. Локальный прогресс сохранён.');
    return false;
  }catch(e){console.warn('Pikabu cloud flush failed',e);setSaveStatus('Не удалось сохранить в облако Пикабу. Локальный прогресс сохранён.');return false}
  finally{pkbFlushBusy=false}
}

function bindPikabuEvents(){
  if(!pkbSdk||typeof pkbSdk.on!=='function')return;

    pkbAuthUnsubscribe=pkbSdk.on('userAuthorized',(player)=>{
      pkbPlayer=pkbSdk.player||player;
      // Pikabu migrates guest storage to the account if the account has no existing save.
      mergeCloudProfile().then(()=>renderScreen()).catch(e=>console.warn('Post-auth cloud refresh failed',e));
    });
    pkbStorageUnsubscribe=pkbSdk.on('storageSaveError',(reason)=>{
      pkbStorageError=reason;
      if(reason==='REVISION_CONFLICT')setSaveStatus('Сохранение изменено на другом устройстве. Перезагрузи игру, чтобы загрузить актуальный прогресс.');

  }catch(e){console.warn('Pikabu SDK event binding failed',e)}

async function showFullscreenAdBetweenRuns(){
  const prefix='[NEON-RACE][Fullscreen]';
  if(!pkbSdk){
    console.info(prefix,'skipped: Pikabu SDK is not initialized');
    return false;
  }
  const ad=pkbSdk.ads?.fullscreen;
  if(!ad){
    console.warn(prefix,'SDK does not expose ads.fullscreen');
    return false;
  }
  console.info(prefix,'availability check',{isSupported:ad.isSupported});
  if(!ad.isSupported){
    console.info(prefix,'skipped: NOT_SUPPORTED');
    return false;
  }
  try{
    const canShow=await ad.canShow();
    console.info(prefix,'canShow() returned',canShow);
    if(!canShow){
      console.info(prefix,'skipped: canShow() returned false (cooldown or temporary unavailability)');
      return false;
    }
    // Write the just-finished run to Pikabu storage before opening the ad overlay.
    if(pkbSdk.storage)await syncPikabuCloud(false);
    // Gameplay is already stopped by finishRun(); pause Web Audio during the ad.
    if(audio&&audio.state==='running')await audio.suspend().catch(()=>{});
    console.info(prefix,'calling show()');
    const result=await ad.show();
    console.info(prefix,'show() result',result);
    if(result?.rendered===true){
      console.info(prefix,'fullscreen slot was rendered');
      return true;
    }
    console.warn(prefix,'fullscreen slot was not rendered',result?.reason||'UNKNOWN');
    return false;
  }catch(error){
    console.warn(prefix,'fullscreen request failed; continuing to results',error);
    return false;
  }finally{
    if(soundOn&&audio&&audio.state==='suspended')await audio.resume().catch(()=>{});
  }
}

function spawnRock(){

  const r=kind==='shard'?10+Math.random()*8:kind==='hunter'?13+Math.random()*5:14+Math.random()*19;
  const baseSpeed=195+Math.random()*95+Math.min(260,elapsed*3.1);
  const speedFactor=difficulty.rockSpeed*(kind==='shard'?1.42:kind==='hunter'?.98:1);
  const hp=kind==='shard'?1:kind==='hunter'?2+Math.floor(difficulty.tier/2):kind==='drifter'?2:(r>25?2:1);
  rocks.push({kind,x:r+Math.random()*(W-2*r),y:-r,r,vy:baseSpeed*speedFactor,vx:kind==='drifter'?(Math.random()<.5?-1:1)*(70+Math.random()*65+difficulty.tier*16):0,homing:kind==='hunter'?105+difficulty.tier*14:0,hp,maxHp:hp,dead:false,rot:Math.random()*6,spin:(Math.random()-.5)*3});

function fireAutoWeapon(stats){
  const target=rocks.filter(r=>!r.dead&&r.y>-30&&r.y<player.y+130&&Math.hypot(r.x-player.x,r.y-player.y)<760).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];
  if(!target)return false;
  const count=stats.shots,baseAngle=Math.atan2(target.y-player.y,target.x-player.x);

}

function update(dt){if(state!=='play'||levelUpActive)return;const ship=currentShip(),u=profile.upgrades;elapsed+=dt;const difficulty=difficultyProfile();scoreCarry+=dt*10*(1+u.reactor*.10);const earned=Math.floor(scoreCarry);if(earned>0){score+=earned;scoreCarry-=earned}
  const speed=player.speed*(1+u.engine*.12)*(ship.speed||1)*(1+runBuild.thrusters*.09);
  let moveX=(keys.arrowright||keys.d||keys.right?1:0)-(keys.arrowleft||keys.a||keys.left?1:0);
  let moveY=(keys.arrowdown||keys.s||keys.down?1:0)-(keys.arrowup||keys.w||keys.up?1:0);

  if(action==='start-run'){startRun();return}if(action==='resume'){pauseRun();return}if(action==='go-home'){if(state==='paused'){finishRun()}else{showMenu('home')}return}if(action==='reward-ad'){showRewardedAd(b.dataset.source||'menu');return}if(action==='select-leaderboard'){if(LEADERBOARDS[id]){activeLeaderboard=id;renderScreen();loadLeaderboard(id,true)}return}if(action==='refresh-leaderboard'){loadLeaderboard(activeLeaderboard,true);return}
  if(action==='buy-ship'){const s=SHIPS.find(x=>x.id===id);if(!s||profile.unlockedShips.includes(id)||levelInfo().level<s.level||profile.crystals<s.price)return;profile.crystals-=s.price;profile.unlockedShips.push(id);profile.selectedShip=id;saveProgress(true);playSfx('buy');renderScreen();return}
  if(action==='select-ship'){if(profile.unlockedShips.includes(id)){profile.selectedShip=id;saveProgress(true);renderScreen();playSfx('select')}return}
  if(action==='buy-upgrade'){const u=UPGRADES.find(x=>x.id===id);if(!u)return;const lvl=upgradeLevel(id),cost=nextUpgradeCost(u);if(lvl>=u.max||profile.crystals<cost)return;profile.crystals-=cost;profile.upgrades[id]++;saveProgress(true);playSfx('buy');renderScreen();return}
  if(action==='sync-cloud'&&pkbSdk?.storage){syncPikabuCloud(true);return}
  if(action==='authorize-player'){authorizePikabuPlayer();return}
});
$('languageSelect').addEventListener('change',e=>{const next=e.target.value==='en'?'en':'ru';if(next===currentLanguage)return;currentLanguage=next;try{localStorage.setItem(LANGUAGE_KEY,currentLanguage)}catch(err){}applyLanguageShell();renderScreen();updateRunStatus()});
$('pauseBtn').onclick=()=>{if(state==='play')pauseRun()};
$('soundBtn').onclick=()=>setSoundEnabled(!soundOn);$('menuSoundBtn').onclick=()=>setSoundEnabled(!soundOn);updateSoundButtons();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown','a','d','w','s',' '].includes(k))e.preventDefault();keys[k]=true;if(e.key==='Escape'||k==='p'){if(state==='play')pauseRun();else if(state==='paused')pauseRun()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
let pointerDown=false;function movePlayerToPointer(e){if(state!=='play')return;player.x=e.clientX;player.y=e.clientY;clampPlayer()}
canvas.addEventListener('pointerdown',e=>{if(state!=='play')return;pointerDown=true;try{canvas.setPointerCapture(e.pointerId)}catch(_){}movePlayerToPointer(e)});
canvas.addEventListener('pointermove',e=>{if(pointerDown)movePlayerToPointer(e)});
canvas.addEventListener('pointerup',()=>pointerDown=false);canvas.addEventListener('pointercancel',()=>pointerDown=false);
function bindHoldButton(id,key){const el=$(id);const stop=()=>{keys[key]=false};el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}});el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',stop);el.addEventListener('contextmenu',e=>e.preventDefault())}
bindHoldButton('leftBtn','left');bindHoldButton('rightBtn','right');bindHoldButton('upBtn','up');bindHoldButton('downBtn','down');
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(state==='play'){pausedByUser=false;pausedByPlatform=true;pauseInterface(true)}
    stopMusic();if(audio?.state==='running')audio.suspend().catch(()=>{});
    if(pkbSdk?.storage&&(!pkbLastFlushAt||Date.now()-pkbLastFlushAt>=30000)&&!pkbFlushBusy){syncPikabuCloud(true).catch(e=>console.warn('Pikabu background flush failed',e))}
  }else if(state==='paused'&&pausedByPlatform){pausedByPlatform=false;platformPaused=false;resumeInterface(true)}
});
addEventListener('pagehide',()=>{
  saveLocal();
  if(pkbSdk?.storage){
    try{pkbSdk.storage.set('neonRaceProfile',JSON.parse(JSON.stringify(profile)));const pending=pkbSdk.storage.flush();if(pending&&typeof pending.catch==='function')pending.catch(e=>console.warn('Pikabu flush on pagehide failed',e))}catch(e){console.warn('Pikabu cloud save on pagehide failed',e)}
  }
  gameplayStop();
});
applyLanguageShell();updateWallet();renderScreen();loadSDK();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
